<!doctype html>
<meta charset="utf-8">
<title>Semantia Card 06 ASR benchmark</title>
<pre id="output">preparing</pre>
<script type="module">
import { createModel } from 'vosk-browser'

const output = document.querySelector('#output')
const reference = 'Olá, este é um teste de transcrição em português. Hoje vamos conversar sobre acessibilidade e comunicação. O sistema transforma a fala em texto diretamente no navegador. A legenda deve aparecer com clareza durante toda a reunião. Agora vou fazer uma pausa e terminar o teste.'

function normalize(text) {
  return text
    .toLocaleLowerCase('pt-BR')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
}

function wordErrorRate(expected, actual) {
  const a = normalize(expected).split(' ').filter(Boolean)
  const b = normalize(actual).split(' ').filter(Boolean)
  const rows = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0))
  for (let i = 0; i <= a.length; i += 1) rows[i][0] = i
  for (let j = 0; j <= b.length; j += 1) rows[0][j] = j
  for (let i = 1; i <= a.length; i += 1) {
    for (let j = 1; j <= b.length; j += 1) {
      rows[i][j] = Math.min(
        rows[i - 1][j] + 1,
        rows[i][j - 1] + 1,
        rows[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1),
      )
    }
  }
  const errors = rows[a.length][b.length]
  return { errors, referenceWords: a.length, hypothesisWords: b.length, wer: errors / a.length }
}

async function decode(url) {
  const response = await fetch(url)
  const buffer = await response.arrayBuffer()
  const bytes = buffer.byteLength
  const context = new AudioContext({ sampleRate: 16000 })
  const decoded = await context.decodeAudioData(buffer)
  const samples = decoded.getChannelData(0).slice()
  await context.close()
  return { samples, sampleRate: decoded.sampleRate, bytes }
}

async function transcribe(model, fixture) {
  const { samples, sampleRate, bytes } = await decode(fixture.url)
  const recognizer = new model.KaldiRecognizer(sampleRate)
  recognizer.setWords(true)
  const segments = []
  let recognitionError = null
  let lastResultAt = null
  recognizer.on('result', (message) => {
    const text = message?.result?.text?.trim?.() ?? ''
    if (text) segments.push(text)
    lastResultAt = performance.now()
  })
  recognizer.on('error', (message) => {
    recognitionError = new Error(String(message?.error ?? 'recognizer error'))
  })
  const startedAt = performance.now()
  const chunkSize = 4096
  for (let offset = 0; offset < samples.length; offset += chunkSize) {
    recognizer.acceptWaveformFloat(samples.slice(offset, offset + chunkSize), sampleRate)
  }
  recognizer.acceptWaveformFloat(new Float32Array(sampleRate * 2), sampleRate)
  recognizer.retrieveFinalResult()
  const observationWindowMs = 8_000
  await new Promise((resolve) => setTimeout(resolve, observationWindowMs))
  if (recognitionError) throw recognitionError
  const inferenceMs = (lastResultAt ?? performance.now()) - startedAt
  recognizer.remove()
  const text = segments.join(' ').replace(/\s+/g, ' ').trim()
  return {
    name: fixture.name,
    bytes,
    sampleRate,
    durationSeconds: samples.length / sampleRate,
    observationWindowMs,
    inferenceMs,
    realtimeFactor: inferenceMs / 1000 / (samples.length / sampleRate),
    text,
    ...wordErrorRate(reference, text),
  }
}

window.__benchmarkPromise = (async () => {
  const modelStartedAt = performance.now()
  const model = await createModel('/models/vosk-model-small-pt-0.3.model', -1)
  const modelLoadMs = performance.now() - modelStartedAt
  const fixtures = [
    { name: 'clean', url: '/qa/card-06/reference-clean.wav' },
    { name: 'pink-noise-light', url: '/qa/card-06/reference-noisy.wav' },
    { name: 'pink-noise-strong', url: '/qa/card-06/reference-strong-noise.wav' },
    { name: 'competing-speech', url: '/qa/card-06/reference-competing-speech.wav' },
    { name: 'reverberant', url: '/qa/card-06/reference-reverberant.wav' },
  ]
  const results = []
  for (const fixture of fixtures) results.push(await transcribe(model, fixture))
  model.terminate()
  const value = { engine: 'vosk-small-pt-0.3', reference, modelLoadMs, results }
  window.__benchmarkResult = value
  output.textContent = JSON.stringify(value, null, 2)
  return value
})().catch((error) => {
  const value = { error: String(error?.stack ?? error) }
  window.__benchmarkResult = value
  output.textContent = JSON.stringify(value, null, 2)
  throw error
})
</script>
